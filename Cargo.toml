[package]
name = "eccoxide"
version = "0.5.0"
authors = ["Vincent Hanquez <vincent@typed.io>"]
edition = "2021"
keywords = [ "Crypto", "Cryptography", "ECC", "Elliptic", "Curve" ]
categories = [ "cryptography" ]
license = "MIT/Apache-2.0"
description = "elliptic curve cryptography (ECC) framework"
homepage = "https://github.com/vincenthz/eccoxide/"
repository = "https://github.com/vincenthz/eccoxide/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cryptoxide = { version = "0.6", optional = true, default-features = false }

[dev-dependencies]
divan = "0.1"
cryptoxide = "0.6.5"

[[bench]]
name = "curves"
harness = false

[[bench]]
name = "curve25519"
harness = false

[[bench]]
name = "x25519"
harness = false

[[bench]]
name = "ed25519"
harness = false

[[bench]]
name = "bls12_381"
harness = false

[[bench]]
name = "curve448"
harness = false

[[bench]]
name = "x448"
harness = false

[features]
default = ["sec2", "sm2", "table", "curve25519", "ristretto255", "bls12-381",
           "bls12-381-hash-to-curve", "jubjub", "protocols"]

# Embed fixed-base (generator) precomputation tables so `Point::mul_base` uses a
# constant-time comb (~4x faster than a variable-base scalar mult). This adds a
# sizeable amount of static data to the binary; when disabled, `mul_base` falls
# back to a normal scalar multiplication of the generator.
table = []

################################
#### Group of curves
################################

# SEC2 curves enabled by default (224 might be too small in 2020)
sec2 = ["p224k1", "p224r1", "p256k1", "p256r1", "p384r1", "p521r1"]

# This is not recommended to enable as the size is too small for cryptographic needs
# as per NIST SP 800-131A Rev2 which restrict cryptography keys under
# 224 bits for signing data.
sec2-small = ["p112r1", "p128r1", "p160k1", "p160r1", "p160r2", "p192k1", "p192r1"]

# unsupported F2M curve params values, no full implementation
sec2-params-unsupported = []

################################
#### all individual curves
################################

curve25519 = []
curve448 = []
bls12-381 = []
jubjub = ["bls12-381"]

# Hashing to the BLS12-381 groups (RFC 9380): the SSWU maps, the isogenies and
# the suites BLS12381G{1,2}_XMD:SHA-256_SSWU_{RO,NU}_. Pulls cryptoxide for
# SHA-256, hence the separate feature.
bls12-381-hash-to-curve = ["bls12-381", "cryptoxide", "cryptoxide/sha2"]

ristretto255 = ["curve25519"] # built on top of curve25519

p112r1 = []
p128r1 = []
p160k1 = []
p160r1 = []
p160r2 = []
p192k1 = []
p192r1 = []
p224k1 = []
p224r1 = []
p256k1 = []
p256r1 = ["p256r1-optimised"]
p384r1 = []
p521r1 = []

# flag to support optimised handwritten implementation (replacing some fiat-crypto generated operation)
p256r1-optimised = []

# SM2: the recommended 256-bit prime-field curve of the Chinese SM2 standard
# (GB/T 32918 / GM/T 0003). A short Weierstrass curve with a = -3, wired like
# the SEC2 `r1` curves.
sm2 = []

################################
#### Protocols
################################
protocols = ["x25519", "ed25519", "x448", "ecdsa"]

# Protocol built on top of curve25519: Montgomery ladder (X25519) and Signature (Ed25519)
# Note that ed25519 pull cryptoxide for hashing with sha512
x25519 = ["curve25519"]
ed25519 = ["curve25519", "cryptoxide", "cryptoxide/sha2"]

# Ed25519 parametrized by BLAKE2b-512
ed25519-blake2 = ["ed25519", "cryptoxide/blake2"]

# Protocol built on top of curve448: Montgomery ladder (X448)
x448 = ["curve448"]

# ECDSA signatures on the sec2 weierstrass curves.
ecdsa = ["cryptoxide", "cryptoxide/sha2"]
